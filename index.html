<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0e13" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="BlockConnect - A third-party tool development organization for Minecraft. Thirteen open-source projects across rendering, crossplay, performance, AI, launchers, and tooling."
    />
    <meta property="og:title" content="BlockConnect - Minecraft Tooling Collective" />
    <meta
      property="og:description"
      content="Third-party tools for Minecraft, by builders who play. Thirteen open-source projects across six directions."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blockconnect.n0th1n3ssd0ma1n.top" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>BlockConnect - Minecraft Tooling Collective</title>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
